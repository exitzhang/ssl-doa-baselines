[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssl-doa-baselines"
version = "0.1.0"
description = "Standalone multi-source DOA baselines (TF-Mamba, multi-source IcoCNN, SRP-DNN, IPDnet, IPDnet2-Small)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [{ name = "LOCATA baseline integration" }]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "soundfile>=0.11",
    "tomli>=1.2; python_version < '3.11'",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
tf-mamba = ["torch>=2.0", "mamba-ssm==2.1.0"]
icocnn = ["torch>=2.0", "einops>=0.6"]
srp-dnn = ["torch>=2.0"]
ipdnet = ["torch>=2.0", "torchaudio>=2.0"]
ipdnet2 = ["torch>=2.0", "torchaudio>=2.0", "mamba-ssm==2.1.0"]
all = ["torch>=2.0", "torchaudio>=2.0", "mamba-ssm==2.1.0", "einops>=0.6"]

[project.scripts]
ssl-doa-baselines = "ssl_doa_baselines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssl_doa_baselines = ["../configs/*.toml"]
