# SRP-DNN: shared causal CRNN + mixed DP-IPD + iterative detection/localization.
[run]
seed = 42
output_root = "runs"

[model]
name = "srp_dnn"
n_mics = 3
sample_rate = 48000
win_len = 1536
hop = 768
n_fft = 1536
freq_min = 31.25
freq_max = 8000.0
max_num_sources = 3
az_range_deg = [0.0, 180.0]
el_range_deg = [60.0, 120.0]
n_az = 181
n_el = 7

[train]
# Shared comparison budget: 100 epochs, patience 6 eval rounds (early stop),
# matching the TF-Mamba / IcoCNN v4 runs and the V5 mainline budget.
epochs = 100
batch_size = 8
num_workers = 8
lr = 1.0e-3
optimizer = "adam"
weight_decay = 0.0
scheduler = "cosine"
eta_min = 1.0e-6
grad_clip = 1.0
eval_every = 2
patience = 6
amp = true
seed = 42

[data]
max_sources = 3
target_num_samples = 16000
mic_indices = [5, 6, 8]
use_aug = true
enable_noise = true
noise_snr = [5.0, 30.0]
val_noise_snr = [5.0, 30.0]
noise_mix_weights = [1.0, 0.0, 1.0]

[decode]
score_thresholds = [
  0.0, 0.02, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5,
  0.6, 0.7, 0.8, 0.9,
]
acc_thresholds = [5, 10, 15]
max_sources = 3
frame_index = -1
source_column = 10
silence_max_thresh_val = 0.0
silence_max_thresh_dicit = 0.1
far_target = 0.03
