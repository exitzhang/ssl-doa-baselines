# IPDnet2-Small (fixed 3-microphone array, online DP-IPD).
# Author Small configuration: 8 layers, hidden 96, mamba(16,4), 16x frequency
# compression, 5x time compression at layer 0.  48 kHz -> 16 kHz shared
# resampler, 512-point FFT, hop 320.  Requires mamba-ssm==2.1.0.
[run]
seed = 42
output_root = "runs"

[model]
name = "ipdnet2_small"
n_mics = 3
input_sample_rate = 48000
stft_sample_rate = 16000
win_len = 512
n_fft = 512
hop = 320
forgetting_frames = 249
dim_hidden = 96
num_layers = 8
dim_squeeze = 8
num_heads = 4
kernel_size = [5, 3]
conv_groups = [8, 8]
norms = ["LN", "LN", "GN", "LN", "LN", "LN"]
attention = "mamba(16,4)"
rope = false
fre_compression_ratio = 16
time_compression_ratio = 5
time_compression_layer = 0
encoder_kernel_size = 5
max_tracks = 3
pool_factor = 5
ref_mic = 0
az_range_deg = [0.0, 180.0]
n_az = 181
elevation_deg = 90.0
speed = 340.0
score_kind = "neg_mse"

[train]
# Author optimiser/schedule: AdamW, lr 5e-4, exponential gamma 0.975.
epochs = 100
batch_size = 8
num_workers = 8
lr = 5.0e-4
optimizer = "adamw"
weight_decay = 0.01
scheduler = "exponential"
scheduler_gamma = 0.975
grad_clip = 1.0
eval_every = 2
patience = 6
# First formal pass runs FP32 (plan: FP32 parity, then AMP after checks).
amp = false
seed = 42

[data]
max_sources = 3
target_num_samples = 16000
mic_indices = [5, 6, 8]
use_aug = true
enable_noise = true
noise_snr = [5.0, 30.0]
val_noise_snr = [5.0, 30.0]
noise_mix_weights = [1.0, 0.0, 1.0]

[decode]
score_kind = "neg_mse"
# score = -mean((template - track)^2), so threshold -0.4 means MSE <= 0.4.
score_thresholds = [
  -1.0, -0.8, -0.6, -0.5, -0.45, -0.4, -0.35, -0.3, -0.25, -0.2, -0.15,
  -0.1, -0.05, 0.0,
]
acc_thresholds = [5, 10, 15]
max_sources = 3
frame_index = -1
source_column = 10
silence_max_thresh_val = 0.0
silence_max_thresh_dicit = 0.1
far_target = 0.03
